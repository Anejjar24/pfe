# ─────────────────────────────────────────────────────────────────────────────
# AquaFlow — Production Docker Compose
# ─────────────────────────────────────────────────────────────────────────────
# PREREQUISITES (run once before first start):
#
#   1. Create env file:
#        cp .env.example .env.prod
#        # Edit .env.prod — fill in ALL "REQUIRED" values
#
#   2. Generate Mosquitto password file (MQTT auth):
#        docker run --rm eclipse-mosquitto:2 \
#          sh -c "mosquitto_passwd -b /dev/stdout $MQTT_USERNAME $MQTT_PASSWORD" \
#          > mosquitto/config/passwd
#
#   3. Verify secrets are NOT committed:
#        grep -q ".env.prod" .gitignore  # should match
#        grep -q "passwd" .gitignore     # should match
#
# START:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# NOTES:
#   • Postgres (5432) and Redis (6379) are NOT exposed to the host
#   • Backend port 3001 is internal — add nginx/Traefik in front for HTTPS
#   • Frontend listens on port 80 — configure SSL termination separately
# ─────────────────────────────────────────────────────────────────────────────

version: '3.8'

services:

  # ── PostgreSQL 15 ──────────────────────────────────────────────────────────

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # ↑ No `ports:` — Postgres is reachable only within aquaflow-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - aquaflow-network
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.10'
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  # ── Redis 7 ────────────────────────────────────────────────────────────────

  redis:
    image: redis:7-alpine
    # Password-protected + AOF persistence + LRU eviction cap
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --maxmemory 96mb
      --maxmemory-policy allkeys-lru
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}   # exposed to container for health check
    volumes:
      - redis_data:/data
    # ↑ No `ports:` — Redis reachable only within aquaflow-network
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - aquaflow-network
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 32M
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '3'

  # ── Eclipse Mosquitto 2 ────────────────────────────────────────────────────

  mosquitto:
    image: eclipse-mosquitto:2
    volumes:
      - ./mosquitto/config/mosquitto.prod.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/config/passwd:/mosquitto/config/passwd:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_logs:/mosquitto/log
    ports:
      - '9001:9001'   # WebSocket — needed by frontend real-time connection
    # MQTT port 1883 is NOT exposed — backend connects via internal network only
    environment:
      MQTT_USERNAME: ${MQTT_USERNAME}     # needed inside container for health check
      MQTT_PASSWORD: ${MQTT_PASSWORD}
    healthcheck:
      test:
        - 'CMD-SHELL'
        - >
          mosquitto_sub -h localhost -p 1883
          -t "$$SYS/broker/uptime" -C 1 -W 3
          -u "$$MQTT_USERNAME" -P "$$MQTT_PASSWORD"
          2>/dev/null || exit 1
      interval: 15s
      timeout: 8s
      retries: 5
      start_period: 10s
    networks:
      - aquaflow-network
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.10'
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '3'

  # ── NestJS Backend ─────────────────────────────────────────────────────────

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: aquaflow-backend:${IMAGE_TAG:-latest}
    environment:
      NODE_ENV: production
      PORT: 3001
      # Database
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_NAME: ${POSTGRES_DB}
      # Redis (with password)
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # MQTT (with auth — MqttClient reads MQTT_USERNAME + MQTT_PASSWORD)
      MQTT_BROKER_URL: mqtt://mosquitto:1883
      MQTT_USERNAME: ${MQTT_USERNAME}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      # JWT
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      # CORS
      FRONTEND_URL: ${FRONTEND_URL}
      # SMTP (email notifications — all optional; disabled when SMTP_HOST is empty)
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@aquaflow.io}
    # ↑ No `ports:` — backend is internal; add nginx/Traefik for HTTPS
    expose:
      - '3001'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3001/api/health 2>/dev/null | grep -q "\"status\":\"ok\"" || exit 1']
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    networks:
      - aquaflow-network
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.10'
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '5'

  # ── React Frontend (nginx) ─────────────────────────────────────────────────

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Baked into the React bundle at build time by CRA
        REACT_APP_API_URL: ${REACT_APP_API_URL}
        REACT_APP_WS_URL: ${REACT_APP_WS_URL}
    image: aquaflow-frontend:${IMAGE_TAG:-latest}
    ports:
      - '80:80'
      # For HTTPS add: - '443:443'
      # Then mount SSL certs or put Traefik/Certbot in front of this container
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - aquaflow-network
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.20'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 32M
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '3'

# ── Volumes ────────────────────────────────────────────────────────────────

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  mosquitto_data:
    driver: local
  mosquitto_logs:
    driver: local

# ── Networks ───────────────────────────────────────────────────────────────

networks:
  aquaflow-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
